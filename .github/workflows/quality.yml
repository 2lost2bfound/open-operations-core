name: quality

on:
  push:
  pull_request:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository and history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact --verbose --log-opts="--all"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and SSG dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e repo_synthesis/super-skill-creator
      - name: Scan for secret-shaped values
        run: ./scripts/secret-scan.sh
      - name: Check Python imports
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -c "import sys; sys.path.insert(0, 'orchestrator'); import run, intake_document"
      - name: Check CLI entrypoint syntax
        run: python -m py_compile orchestrator/run.py orchestrator/intake_document.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
