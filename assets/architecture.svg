<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Open Operations Core architecture</title>
  <desc id="desc">Operator surface routes documents and model requests through guarded modules and durable state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#20292b"/><stop offset="1" stop-color="#07090b"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#36c6a1"/><stop offset="1" stop-color="#4ea4df"/></linearGradient>
    <style>
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #edf5ef }
      .small { font: 14px Inter, Arial, sans-serif; fill: #9bb0aa }
      .box { fill: #121a1d; stroke: #526b69; stroke-width: 1.5 }
      .accent { fill: #ef9045 }
      .line { stroke: url(#green); stroke-width: 3; fill: none; marker-end: url(#arrow) }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ea4df"/></marker>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <text x="48" y="48" class="small" letter-spacing="3">OPEN OPERATIONS CORE / ARCHITECTURE</text>
  <rect x="55" y="120" width="220" height="120" rx="12" class="box"/>
  <text x="80" y="160" class="label">Operator surface</text>
  <text x="80" y="190" class="small">Demo UI / local hub</text>
  <text x="80" y="215" class="small">jobs · status · modules</text>
  <rect x="345" y="75" width="235" height="105" rx="12" class="box"/>
  <text x="370" y="115" class="label">Document intake</text>
  <text x="370" y="145" class="small">extract · classify · route</text>
  <rect x="345" y="250" width="235" height="105" rx="12" class="box"/>
  <text x="370" y="290" class="label">Model routing</text>
  <text x="370" y="320" class="small">exact · wildcard · rotation</text>
  <rect x="650" y="75" width="235" height="105" rx="12" class="box"/>
  <text x="675" y="115" class="label">Skill pipeline</text>
  <text x="675" y="145" class="small">create · crawl · validate</text>
  <rect x="650" y="250" width="235" height="105" rx="12" class="box"/>
  <text x="675" y="290" class="label">Quality gates</text>
  <text x="675" y="320" class="small">security · install · audit</text>
  <rect x="955" y="120" width="190" height="120" rx="12" class="box"/>
  <text x="980" y="160" class="label">Durable state</text>
  <text x="980" y="190" class="small">manifests · logs</text>
  <text x="980" y="215" class="small">Open Questions</text>
  <path d="M275 165 C305 165 315 128 345 128" class="line"/>
  <path d="M275 195 C305 195 315 303 345 303" class="line"/>
  <path d="M580 128 L650 128" class="line"/>
  <path d="M580 303 L650 303" class="line"/>
  <path d="M885 128 C920 128 920 165 955 165" class="line"/>
  <path d="M885 303 C920 303 920 195 955 195" class="line"/>
  <circle cx="930" cy="55" r="6" class="accent"/>
  <text x="950" y="61" class="small">human review remains explicit</text>
</svg>
